[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "charge-insight"
version = "0.1.0"
description = "Reproducible CPU baselines for UrbanEV regional charging occupancy forecasting"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4"]

[tool.setuptools.packages.find]
include = ["charge_insight*"]
